<%
# Input parameters
rviz         = @settings["rviz"] == "true"
rosbag       = @settings["rosbag"] == "true"
keyboard_teleoperation = @settings["keyboard_teleoperation"] == "true"
%>

name: ground_station
attach: true
root: ./
startup_window: mission
windows:
  <%- if rviz %>
  # RViz
  - rviz:
      layout:
      panes:
        - ros2 launch as2_visualization swarm_viz.launch.py
            namespace_list:=drone0
            rviz_config:=config/rviz2_config.rviz
            drone_model:=quadrotor_base
            use_sim_time:=false
  <%- end %>

  <%- if rosbag %>
  # ROSbag recording
  - rosbag:
      layout:
      panes:
        - ./rosbag/record_rosbag.bash drone0
  <%- end %>

  <%- if keyboard_teleoperation %>
  # Keyboard teleoperation
  - keyboard_teleop:
      layout:
      panes:
        - ros2 launch as2_keyboard_teleoperation as2_keyboard_teleoperation_launch.py
            namespace:=drone0
            use_sim_time:=false
  <%- end %>

  - mocap:
      layout:
      panes:
        - ros2 launch mocap4r2_optitrack_driver optitrack2.launch.py
            namespace:=mocap
            config_file:=config/mocap4ros.yaml
        - sleep 1; ros2 lifecycle set /mocap/mocap4r2_optitrack_driver_node activate
        - ros2 launch as2_external_object_to_tf as2_external_object_to_tf_launch.py
            namespace:=drone0
            use_sim_time:=false
            mocap_topic:=/rigid_bodies
            config_file:=config/ext_to_tf_config.yaml

